name: Trigger auto deployment for realtimemcp

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ master ]
    paths:
    - '**'
    - '.github/workflows/realtimemcp-AutoDeployTrigger-4e4ae891-f9a0-45cd-aa2e-6c056f1fa82b.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.REALTIMEMCP_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.REALTIMEMCP_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.REALTIMEMCP_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: realitimemessagingacr-ewaxdbgtazcjcsh8.azurecr.io
          registryUsername: ${{ secrets.REALTIMEMCP_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.REALTIMEMCP_REGISTRY_PASSWORD }}
          containerAppName: realtimemcp
          resourceGroup: RES_Transactions
          imageToBuild: realitimemessagingacr-ewaxdbgtazcjcsh8.azurecr.io/realtimemcp:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


